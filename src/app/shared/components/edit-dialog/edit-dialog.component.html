<h2 class="title">Edit Category</h2>
  <div class="form-field">
    <label>Category Name</label>
    <mat-form-field appearance="outline" class="custom-textfield">
        <input class="input-field" matInput [(ngModel)]="updatedName" />
      </mat-form-field>
  </div>
<div class="btn-group" align="end">
  <button class="secondary-btn" (click)="onCancel()">Cancel</button>
  <button class="primary-btn" (click)="onUpdate()">Update</button>
</div>
