<h2 class="title">Delete Vendor</h2>

<div>
  <p class="description">This Vendor provides these items:</p>
</div>

<!-- Table Container with Custom Styling -->
<div class="app-table">
  <app-table 
  [data]="dataSource" 
  [config]="columns">
</app-table>
</div>


<!-- Paginator -->
<mat-paginator 
  [length]="totalRecords" 
  [pageSize]="pageSize" 
  (page)="onPageChange($event)">
</mat-paginator>


  <p class="confirm-message">Are you sure you want to delete this Vendor?</p>

<div class="btn-group" align="end">
  <button class="secondary-btn" (click)="closeDialog(DialogCloseResponse.NO_ACTION)">No</button>
  <button class="primary-btn" color="warn" (click)="closeDialog(DialogCloseResponse.DELETE)">Yes</button>
</div>
