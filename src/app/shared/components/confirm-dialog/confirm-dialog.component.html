<h2 class="title">{{ data.title || 'Confirm' }}</h2>
    <div class="confirm-message">
      <p [innerHTML]="data.message"></p>
    </div>
    <div class="btn-group" align="end">
      <button  class="secondary-btn" (click)="onCancel()">   {{ data.cancelButtonText || 'Cancel' }}</button>
      <button  class="primary-btn" color="warn" (click)="onConfirm()">{{ data.confirmButtonText || 'Delete' }}</button>
    </div>
