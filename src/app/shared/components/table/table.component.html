<div class="table-container">
<table class="app-table">
  <!-- Table Header -->
   <thead>
  <tr class="header-row">
      <ng-container *ngFor="let col of config">
          <th [title]="col?.label">{{ col?.label }}</th>
      </ng-container>
  </tr>
  <tr class="filter-row">
    <ng-container *ngFor="let col of config">
      <th>
        <ng-container *ngIf="col.filterable">
          <div class="filter-input-wrapper">
            <input 
              type="text" 
              #filterInput
              (input)="onFilterChange($event, col.key)" 
              placeholder="Filter {{ col.label }}" />
            <button class="clear-filter-btn" *ngIf="filterInput.value" (click)="clearFilter(filterInput, col.key)">
              <!--<mat-icon svgIcon="close"></mat-icon> -->
              <mat-icon>close</mat-icon>

            </button>
          </div>
        </ng-container>
      </th>
    </ng-container>
  </tr>

</thead>

  <!-- Table Rows -->
   <tbody>
   

  <ng-container *ngFor="let row of data; let i = index"> 
    

      <tr class="data-row">
          <!-- Dynamic Columns -->
<ng-container *ngFor="let col of config">
    <td *ngIf="col?.columnType === ColumnType.SERIAL_NUMBER">
        {{ i + 1 }}
    </td>

    <td *ngIf="col?.columnType === ColumnType.GENERAL">
        {{ row[col?.key] }}
    </td>

    <td *ngIf="col?.columnType === ColumnType.INPUT_NUMBER">
        <mat-form-field>
            <input matInput type="number" [(ngModel)]="row[col?.key]">
        </mat-form-field>
    </td>

    <!-- Dynamic Action Buttons -->
<td *ngIf="col?.columnType === ColumnType.ACTION">
    <ng-container *ngFor="let action of col.actions">
      <span class="icon-wrapper" *ngIf="action === TableActions.EDIT">
        <mat-icon 
          class="edit-btn" 
          svgIcon="edit" 
          (click)="handleAction({ action: action, row: row })">
        </mat-icon>
      </span>
      
      <span class="icon-wrapper" *ngIf="action === TableActions.DELETE">
        <mat-icon 
          class="delete-btn" 
          svgIcon="delete"
          (click)="handleAction({ action: action, row: row })">
        </mat-icon>
      </span>
    </ng-container>
  </td>
  
</ng-container>
      </tr>
  </ng-container>
</tbody>
</table>
</div>
