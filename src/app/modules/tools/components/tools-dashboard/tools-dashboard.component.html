<div class="tools-dashboard">
  <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="tab-heading">
    <a mat-tab-link *ngFor="let tab of tabs"
       [routerLink]="tab.route"
       [active]="activeTabLink == tab.route">
       {{tab.label}}
    </a>
  </nav>
  <mat-tab-nav-panel #tabPanel>
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>
</div>
