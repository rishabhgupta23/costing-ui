<table mat-table [dataSource]="partList" class="production-part-table">
  <!-- Select Checkbox Column -->
  <ng-container matColumnDef="select">
    <th mat-header-cell *matHeaderCellDef>
      <mat-checkbox
        (change)="selectAll($event)"
        [checked]="isAllSelected()"
        [indeterminate]="isIndeterminate()"
      ></mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let part">
      <mat-checkbox
        [checked]="isSelected(part.partId)"
        (change)="toggleSelection(part.partId, $event.checked)"
      >
      </mat-checkbox>
    </td>
  </ng-container>

  <ng-container matColumnDef="partNumber">
    <th mat-header-cell *matHeaderCellDef>
      <div class="header-det">
        Part Number
        <mat-icon
          [svgIcon]="getSortIcon('partNumber')"
          (click)="toggleSort('partNumber')"
          class="sort-icon"
        ></mat-icon>
      </div>
      <div class="filter-row">
        <div class="filter-input-wrapper">
          <input
            matInput
            [(ngModel)]="searchTerms['partNumber']"
            (input)="applyFilter()"
            placeholder="Search Number"
          />
        </div>
      </div>
    </th>
    <td mat-cell *matCellDef="let part">{{ part.partNumber }}</td>
  </ng-container>

  <ng-container matColumnDef="partName">
    <th mat-header-cell *matHeaderCellDef>
      <div class="header-det">
        Part Name
        <mat-icon
          [svgIcon]="getSortIcon('partName')"
          (click)="toggleSort('partName')"
          class="sort-icon"
        ></mat-icon>
      </div>
      <div class="filter-row">
        <div class="filter-input-wrapper">
          <input
            matInput
            [(ngModel)]="searchTerms['partName']"
            (input)="applyFilter()"
            placeholder="Search Name"
          />
        </div>
      </div>
    </th>
    <td mat-cell *matCellDef="let part">{{ part.partName }}</td>
  </ng-container>

  <ng-container matColumnDef="unit">
    <th mat-header-cell *matHeaderCellDef>
      <div class="header-det">
        Measuring Unit
        <mat-icon
          [svgIcon]="getSortIcon('unit')"
          (click)="toggleSort('unit')"
          class="sort-icon"
        ></mat-icon>
      </div>
      <div class="filter-row">
        <div class="filter-input-wrapper">
          <input
            matInput
            [(ngModel)]="searchTerms['unit']"
            (input)="applyFilter()"
            placeholder="Search Unit"
          />
        </div>
      </div>
    </th>
    <td mat-cell *matCellDef="let part">{{ part.unit }}</td>
  </ng-container>

  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>
      <div class="header-det">
        Type
        <mat-icon
          [svgIcon]="getSortIcon('type')"
          (click)="toggleSort('type')"
          class="sort-icon"
        ></mat-icon>
      </div>
      <div class="filter-row">
        <div class="filter-input-wrapper">
          <input
            matInput
            [(ngModel)]="searchTerms['type']"
            (input)="applyFilter()"
            placeholder="Search Type"
          />
        </div>
      </div>
    </th>
    <td mat-cell *matCellDef="let part">{{ part.type }}</td>
  </ng-container>

  <ng-container matColumnDef="categoryName">
    <th mat-header-cell *matHeaderCellDef>
      <div class="header-det">
        Category
        <mat-icon
          [svgIcon]="getSortIcon('categoryName')"
          (click)="toggleSort('categoryName')"
          class="sort-icon"
        ></mat-icon>
      </div>
      <div class="filter-row">
        <div class="filter-input-wrapper">
          <input
            matInput
            [(ngModel)]="searchTerms['categoryName']"
            (input)="applyFilter()"
            placeholder="Search Category"
          />
        </div>
      </div>
    </th>
    <td mat-cell *matCellDef="let part">{{ part.categoryName }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
<mat-paginator
  [length]="totalRecords"
  [pageSize]="pageSize"
  (page)="onPageChange($event)"
>
</mat-paginator>
