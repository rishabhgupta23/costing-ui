<div class="dialog-box">
<h2 mat-dialog-title>Select Parts</h2>
<mat-dialog-content>
  <table mat-table  [dataSource]="partList" class="bom-table">
    <!-- Select Checkbox Column -->
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox (change)="selectAll($event)" [checked]="isAllSelected()" [indeterminate]="isIndeterminate()"></mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let part">
        <mat-checkbox 
          [checked]="checkIfSelected(part)" 
          (change)="togglePartSelection(part, $event)">
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- Part Name Column -->
    <ng-container matColumnDef="partName">
      <th mat-header-cell *matHeaderCellDef (click)="sortData('partName')">Part Name
        <span *ngIf="sortColumn === 'partName'">
          {{ sortMode=== 'asc' ? '⬆️' : '⬇️' }}
        </span>
        <input matInput [(ngModel)]="searchTermName" (input)="filterParts()" placeholder="Search Name">

      </th>
      <td mat-cell *matCellDef="let part">{{ part.partName }}</td>
    </ng-container>

    <!-- Part Number Column -->
    <ng-container matColumnDef="partNumber">
      <th mat-header-cell *matHeaderCellDef (click)="sortData('partNumber')">Part Number
        <span *ngIf="sortColumn === 'partNumber'">
          {{ sortMode === 'asc' ? '⬆️' : '⬇️' }}
        </span>
        <input matInput [(ngModel)]="searchTermNumber" (input)="filterParts()" placeholder="Search Name">

      </th>
      <td mat-cell *matCellDef="let part">{{ part.partNumber }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-dialog-content>
  <mat-paginator 
  [length]="totalRecords" 
  [pageSize]="pageSize" 
  (page)="onPageChange($event)">
</mat-paginator>
<mat-dialog-actions>
  <button class="primary-btn" (click)="closeDialog()">Cancel</button>
  <button class="primary-btn" (click)="confirmSelection()">Select Parts</button>
</mat-dialog-actions>
</div>
