<div class="app-page">
    <div class="page-header">
        <span class="page-title">PART VIEW</span>
        <div class="dialog-action">
            <button class="primary-btn" (click)="editPart()">
              Edit this part
            </button>
          </div>
    </div>
    <div class="page-content">
        <div class="card part-form-container">
            <div [formGroup]="partForm">
                <!-- Part Details Section-->
                <div class="sub-heading">Part Details</div>
                <div class="part-form">
                    <div>Part Number</div>
                    <div>
                        <mat-form-field appearance="outline">
                            <input matInput placeholder="Enter Part Number" formControlName="partNumber" readonly>
                        </mat-form-field>
                    </div>
                    <div>Part Name</div>
                    <div>
                        <mat-form-field appearance="outline">
                            <input matInput placeholder="Enter Name" formControlName="partName" readonly>
                        </mat-form-field>
                    </div>
                    <div>Type</div>
                    <div>
                        <mat-form-field appearance="outline">
                            <mat-select placeholder="Select Part Type" formControlName="partType">
                                <ng-container *ngFor="let item of partTypes">
                                    <mat-option [value]="item">{{item}}</mat-option>
                                </ng-container>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div>Category</div>
                    <div>
                        <mat-form-field appearance="outline">
                            <mat-select formControlName="categoryId">
                                <ng-container *ngFor="let item of partCategories">
                                    <mat-option [value]="item">{{item}}</mat-option>
                                </ng-container>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div>Unit</div>
                    <div>
                        <mat-form-field appearance="outline">
                            <mat-select placeholder="Select Part Unit" formControlName="partUnit">
                                <ng-container *ngFor="let item of partUnits">
                                    <mat-option [value]="item">{{item}}</mat-option>
                                </ng-container>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>  
            </div>
            <div *ngIf="partForm.get('partType')?.value === partTypeEnum.UNIT">
                <hr>
                <div class="sub-heading">Vendor Cost Details</div>
                <mat-accordion class="example-headers-align" multi>
                    <mat-expansion-panel *ngFor="let vendor of vendorCostMap.keys(); let i=index">
                      <mat-expansion-panel-header>
                        <mat-panel-title> Vendor {{i+1}}: {{ getVendorName(vendor) }}  </mat-panel-title>
                      <mat-panel-description>
                        <mat-icon class="delete-btn" svgIcon="history" (click)="openHistoryDialog(partId,vendor)"> </mat-icon>
                      </mat-panel-description>
                    </mat-expansion-panel-header>
                      <div class="vendor-panel-content">
                            <div>
                                <app-table *ngIf="(vendorCostMap.get(vendor) || []).length > 0" [data]="vendorCostMap.get(vendor) || []" [config]="filteredCostFactorTableColumns"></app-table>
                              </div>
                          </div>
                        </mat-expansion-panel>
                    </mat-accordion>
            </div> 
            <div *ngIf="partForm.get('partType')?.value === partTypeEnum.MASTER">
              <div *ngIf="bomPartList.length > 0">
                <br>
                <div class="sub-heading">BOM Parts</div>
                <app-table [data]="bomPartList" [config]="filteredBomTableColumns"></app-table>
              </div>
            </div>  
        </div>
    </div>
</div>
