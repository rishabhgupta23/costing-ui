<div class="app-page">
    <div class="page-header">
        <span class="page-title">{{ partId ? 'Edit Part' : 'Create Part' }}</span>
        <div class="dialog-action">
            <button class="primary-btn" [disabled]="partForm.invalid" (click)="onSubmit()">
              {{ partId ? 'Update' : 'Create' }}
            </button>
          </div>
    </div>
    <div class="page-content">
        <div class="card part-form-container">
            <div [formGroup]="partForm">
                <!-- Part Details Section-->
                <div class="sub-heading">Part Details</div>
                <div class="part-form">
                    <div>Part Number</div>
                    <div>
                        <mat-form-field appearance="outline">
                            <input matInput placeholder="Enter Part Number" formControlName="partNumber" readonly>
                        </mat-form-field>
                    </div>
                    <div>Part Name</div>
                    <div>
                        <mat-form-field appearance="outline">
                            <input matInput placeholder="Enter Name" formControlName="partName" readonly>
                        </mat-form-field>
                    </div>
                    <div>Type</div>
                    <div>
                        <mat-form-field appearance="outline">
                            <mat-select placeholder="Select Part Type" formControlName="partType">
                                <ng-container *ngFor="let item of partTypes">
                                    <mat-option [value]="item">{{item}}</mat-option>
                                </ng-container>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div>Category</div>
                    <div>
                        <mat-form-field appearance="outline">
                            <mat-select placeholder="Select Part Category" formControlName="categoryId">
                                <ng-container *ngFor="let item of partCategories">
                                    <mat-option [value]="item">{{item}}</mat-option>
                                </ng-container>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div>Unit</div>
                    <div>
                        <mat-form-field appearance="outline">
                            <mat-select placeholder="Select Part Unit" formControlName="partUnit">
                                <ng-container *ngFor="let item of partUnits">
                                    <mat-option [value]="item">{{item}}</mat-option>
                                </ng-container>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>  
            </div>
            <div *ngIf="partForm.get('partType')?.value === partTypeEnum.UNIT">
                <hr>
                <div class="sub-heading">Vendor Cost Details</div>
                <app-table *ngIf="vendorCostMap && vendorCostMap.size > 0" 
                           [data]="getVendorCostTableData()" 
                           [config]="VENDOR_COST_TABLE_COLUMNS">
                </app-table>
            </div> 
                    </div>
            </div>
            <div *ngIf="partForm.get('partType')?.value === partTypeEnum.MASTER" [formGroup]="bomDetailsForm">
              <div *ngIf="bomPartList.length > 0">
                <br>
                <div class="sub-heading">BOM Parts</div>
                <app-table [data]="bomPartList" [config]="BOM_TABLE_COLUMNS"></app-table>
              </div>
              
        </div>
    </div>
