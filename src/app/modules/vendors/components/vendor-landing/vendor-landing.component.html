    <div class="app-page">
        <div class="page-header">
            <span class="page-title">Vendors</span>
            <span class="button-group">
                <button class="primary-btn" *ngIf="isAllowedToCreate()" (click)="createVendor()">Create</button>
                <button class="primary-btn" (click)="downloadExcel()">
                    <mat-icon class="btn-icon" svgIcon="download" ></mat-icon>
                    Download
                </button>
            </span>
        </div>
        <div class="page-content">
            <div class="card-nc">
                <div class="table-container">
                <div class="table-content">
                <app-table
                            [data]="vendorList" 
                            [(sort)] = "sortState" 
                            (filterChange)="applyFilter($event)"
                            (sortChange)="applySort($event)"
                            [config]="columns"
                            [showFilter]="true"
                            [showSort]="true"
                            (actionTriggered)="handleAction($event)">
                        </app-table>
                        
            </div>
            <mat-paginator 
                        [length]="totalRecords" 
                        [pageSize]="pageSize" 
                        (page)="onPageChange($event)">
                    </mat-paginator>
                    </div>
                </div>
        </div>
    </div>
