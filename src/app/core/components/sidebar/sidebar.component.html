<div class="sidebar">
    <div class="menu-container">
        <ng-container *ngFor="let item of menuItems">
            <span *ngIf="!item.position" 
                class="menu-item" 
                [ngClass]="item === selectedMenu ? 'menu-item--active' : ''" 
                (click)="menuClicked(item)">
                {{ item.label }}
            </span>
        </ng-container>
    </div>
    <div class="menu-bottom">
        <ng-container *ngFor="let item of menuItems">
            <span *ngIf="item.position === 'bottom'" 
                class="menu-item" 
                [ngClass]="item === selectedMenu ? 'menu-item--active' : ''" 
                (click)="menuClicked(item)">
                {{ item.label }}
            </span>
        </ng-container>
    </div>
</div>
